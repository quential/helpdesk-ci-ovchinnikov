services:
  dbtest:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdesk_test
      POSTGRES_USER: student
      POSTGRES_PASSWORD: local_training_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d helpdesk_test"]
      interval: 3s
      timeout: 3s
      retries: 20
