services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: student
      POSTGRES_PASSWORD: local_training_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d helpdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - helpdesk_data:/var/lib/postgresql/data
  app:
    image: ${APP_IMAGE:-helpdesk-ci:local}
    build: .
    environment:
      DB_HOST: db
      DB_NAME: helpdesk
      DB_USER: student
      DB_PASSWORD: local_training_only
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  helpdesk_data:
